<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="お店が欲しい人数ぴったりを、ゲートの開け閉めだけで案内する60秒ゲーム">
<title>行列作成</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div id="game" data-theme="pop">
    <canvas id="cv"></canvas>

    <button id="gateBtn" type="button" aria-label="ゲートの開け閉め切り替え">
      <span class="l1">開ける</span>
      <span class="l2">開け閉め切り替え</span>
    </button>

    <div id="title" class="overlay">
      <div class="panel">
        <h1>行列作成</h1>
        <p class="lead">お店が「○人くださ〜い」と言ったら、ゲートを開け閉めして<b>ぴったりの人数</b>を案内しよう！</p>
        <ul class="rules">
          <li>ゲートを開けている間、だんだん速く人が出ていく</li>
          <li>閉めた時点で、その集団の人数が決まる</li>
          <li>制限時間は60秒。連続で成功するとボーナス</li>
        </ul>
        <div class="themes" role="group" aria-label="見た目">
          <span class="tl">見た目</span>
          <button type="button" data-theme="simple">線画</button>
          <button type="button" data-theme="pop">ポップ</button>
          <button type="button" data-theme="neon">ネオン</button>
        </div>
        <button id="startBtn" type="button" class="big">スタート</button>
        <p class="hi">ハイスコア <span id="hiTitle">0</span></p>
        <p class="hint">PCはスペースキーでも開け閉めできます</p>
      </div>
    </div>

    <div id="result" class="overlay hidden">
      <div class="panel">
        <h2>しゅうりょう！</h2>
        <div class="score"><span id="rScore">0</span><small>点</small></div>
        <p id="rNew" class="new hidden">ハイスコア更新！</p>
        <dl class="stats">
          <div><dt>案内成功</dt><dd id="rOk">0回</dd></div>
          <div><dt>案内人数</dt><dd id="rPeople">0人</dd></div>
          <div><dt>ミス</dt><dd id="rMiss">0回</dd></div>
          <div><dt>最大コンボ</dt><dd id="rCombo">0</dd></div>
        </dl>
        <button id="retryBtn" type="button" class="big">もう一度</button>
        <button id="toTitleBtn" type="button" class="sub">タイトルへ</button>
      </div>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
